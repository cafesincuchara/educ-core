spring.application.name=edu-core

# 1. Configuración de la base de datos H2
spring.datasource.url=jdbc:h2:mem:educoredb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Habilitar la consola H2 para que la veas en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 3. Configuración de Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true